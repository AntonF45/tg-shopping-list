name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Если ваша ветка называется master, замените main на master

# Даем права на запись страниц
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Установка зависимостей
        run: npm ci
      - name: Сборка проекта
        run: npm run build
      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v4
      - name: Загрузка артефакта сборки
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4